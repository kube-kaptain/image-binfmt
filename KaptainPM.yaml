apiVersion: kaptain.org/1.39
kind: docker-build-retag

spec:
  global:
    release:
      versioning:
        maxParts: '4'
        strategy: file-pattern-match
        patternType: custom
        source:
          subPath: kaptainpm/final
          fileName: KaptainPM.yaml
          pattern: '^[[:space:]]*sourceTag:[[:space:]]*[''"]?qemu-v([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+[''"]?$'
          prefixParts: '3'
  main:
    docker:
      platform: linux/amd64,linux/arm64
      retag:
        sourceRegistry: docker.io
        sourceNamespace: tonistiigi
        sourceImageName: binfmt
        sourceTag: 'qemu-v10.2.3-68'
